<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Call & await Vue components like async functions, powered by @retronew/call-vue."
    />
    <meta name="theme-color" content="#fafafa" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M10 7h3l1.5 5-2 1.5a15 15 0 0 0 6 6l1.5-2 5 1.5v3a3 3 0 0 1-3 3A18 18 0 0 1 7 10a3 3 0 0 1 3-3Z' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem('call-vue:theme')
        const dark =
          savedTheme === 'dark' ||
          ((savedTheme === 'system' || (savedTheme !== 'dark' && savedTheme !== 'light')) &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {
        // Theme initialization falls back to the application runtime.
      }
    </script>
    <title>Call Vue · @retronew/call-vue</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
