<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Headless, accessible toast notifications for Vue 3, powered by @retronew/toast-core."
    />
    <meta name="theme-color" content="#fafafa" />
    <script>
      try {
        const savedTheme = localStorage.getItem('toast-vue:theme')
        const dark =
          savedTheme === 'dark' ||
          ((savedTheme === 'system' || (savedTheme !== 'dark' && savedTheme !== 'light')) &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {
        // Theme initialization falls back to the application runtime.
      }
    </script>
    <title>Toast Vue · @retronew/toast-vue</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
