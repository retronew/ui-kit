name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test
        run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      - name: Check bundle sizes
        run: pnpm sizecheck
      - name: Check core performance budgets
        run: pnpm perfcheck

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm e2e:install
      - name: Build demo
        run: pnpm --filter vue-demo build
      - name: Run browser tests
        run: pnpm e2e
