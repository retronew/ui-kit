packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^26.2.0
  typescript: ^7.0.2
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: ^0.2.8
  vue: ^3.5.41
  '@vue/test-utils': ^2.4.11
  '@vitejs/plugin-vue': ^6.0.8
  jsdom: ^30.0.1
  unocss: ^66.7.5
  oxlint: ^1.78.0
  oxfmt: ^0.63.0
  '@configurajs/vite-plus': ^0.2.6
  yace: ^1.1.0
  vue-i18n: ^11.4.8
  '@iconify-json/lucide': ^1.2.123
  cnfast: ^0.1.0
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@changesets/cli': ^3.0.0
  '@playwright/test': ^1.62.1
  '@axe-core/playwright': ^4.12.1
  '@vitest/coverage-v8': ^4.1.10
overrides:
  nanoid: 3.3.17
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.0.0'
  - '@changesets/assemble-release-plan@7.0.0'
  - '@changesets/changelog-git@1.0.0'
  - '@changesets/cli@3.0.0'
  - '@changesets/config@4.0.0'
  - '@changesets/errors@1.0.0'
  - '@changesets/get-dependents-graph@3.0.0'
  - '@changesets/git@4.0.0'
  - '@changesets/parse@1.0.0'
  - '@changesets/pre@3.0.0'
  - '@changesets/read@1.0.0'
  - '@changesets/should-skip-package@1.0.0'
  - '@changesets/types@7.0.0'
  - '@changesets/write@1.0.0'
