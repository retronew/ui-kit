packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^26.2.0
  typescript: ^7.0.2
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: ^0.2.8
  vue: ^3.5.41
  '@vue/test-utils': ^2.4.11
  '@vitejs/plugin-vue': ^6.0.8
  jsdom: ^30.0.1
  unocss: ^66.7.5
  oxlint: ^1.78.0
  oxfmt: ^0.63.0
  '@configurajs/vite-plus': ^0.2.6
  yace: ^1.1.0
  vue-i18n: ^11.4.8
  '@iconify-json/lucide': ^1.2.123
  cnfast: ^0.1.0
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@changesets/cli': ^2.31.1
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
